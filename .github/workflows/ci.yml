name: CI & Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest Suite & Architecture Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Code Syntax
        run: |
          python -m py_compile app.py train.py models/*.py preprocessing/*.py dashboard/*.py scripts/*.py

      - name: Run Test Suite
        env:
          STREAMING_MODE: cloud
        run: |
          pytest
